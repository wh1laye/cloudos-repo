# CloudOS Package Manager Repositories Configuration
# Each repository on its own line: name = path_or_url

# Main CloudOS overlay
cloudos = /cloudpkg/overlay

# External recipes repository (can be local path or git URL)
# To use from GitHub:
# cloudpkg-recipes = https://github.com/wh1laye/cloudpkg-recipes.git
#
# To use local path:
cloudpkg-recipes = /var/db/cloudpkg/recipes
