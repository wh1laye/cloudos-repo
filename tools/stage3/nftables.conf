#!/usr/sbin/nft -f
flush ruleset

table inet cloudos {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		tcp flags & (fin | syn) == fin | syn drop
		tcp flags & (syn | rst) == syn | rst drop
		tcp flags & (fin | syn | rst | psh | ack | urg) == 0x0 drop
		ct state new tcp flags & (fin | syn | rst | ack) != syn drop
		ct state { established, related } accept
		iifname "lo" accept
		iifname != "lo" ip daddr 127.0.0.0/8 drop
		iifname != "lo" ip saddr 127.0.0.0/8 drop
		iifname != "lo" ip6 saddr ::1 drop
		iifname != "lo" ip6 daddr ::1 drop

		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		ip protocol icmp icmp type echo-request limit rate 10/second burst 20 packets accept
		ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second burst 20 packets accept

		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		include "/etc/nftables.d/*.nft"

		limit rate 5/minute burst 10 packets log prefix "nft-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;

		ct state invalid drop
	}
}
