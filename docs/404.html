<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>страница не найдена: cloudos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'><path d='M16 36a12 12 0 0 1-1-24 16 16 0 0 1 30 4 10 10 0 0 1 3 20z' fill='%233b5fa8'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html{--bg:#1a1c20;--surf:#22252a;--line:#33373e;--ink:#e6e8ec;--mute:#98a2ae;--ac:#8fb4f0;--onac:#11151b}html[data-theme=light]{--bg:#f6f8fc;--surf:#fff;--line:#e2e8f2;--ink:#17202e;--mute:#66758a;--ac:#3563c9;--onac:#fff}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.box{width:min(520px,100%);text-align:center}.code{font:600 88px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--ac);letter-spacing:-.04em;margin:0 0 6px}h1{font-size:26px;margin:0 0 8px;font-weight:600}p{color:var(--mute);margin:0 0 24px}.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}a{display:inline-block;padding:9px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);text-decoration:none;font-weight:500;transition:border-color .12s}a:hover{border-color:var(--ac)}a.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}</style>
<script>(function(){var t='gray';try{if(localStorage.getItem('theme')==='light')t='light'}catch(e){}document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
<div class="box">
<p class="code">404</p>
<h1>страница не найдена</h1>
<p>такой страницы нет или она переехала. вернись на главную или открой нужный раздел.</p>
<div class="row" id="lk"></div>
</div>
<script>
(function(){
var p=location.pathname.split('/').filter(Boolean);
var b=location.hostname.slice(-9)==='github.io'&&p.length?'/'+p[0]+'/':'/';
var l=[['','главная','p'],['handbook/','справочник',''],['news/','новое',''],['forum/','форум',''],['releases/','релизы','']];
document.getElementById('lk').innerHTML=l.map(function(x){return '<a class="'+x[2]+'" href="'+b+x[0]+'">'+x[1]+'</a>'}).join('');
})();
</script>
</body>
</html>
