# CloudOS Package Manager Configuration

# Mirror URLs for downloading source files
mirror=https://distfiles.cloudos.org
mirror=https://mirror.cloudos.ru/distfiles
mirror=https://mirrors.cloudos.net/distfiles

# Local cache for downloaded files
distdir=/var/cache/cloudpkg/distfiles

# Number of snapshots to keep
snapshots=5

# Repositories configuration file
repos-conf=/cloudpkg/etc/cloudpkg/repos.conf

# Build options
jobs=$(nproc)
keep-workdir=no

# CloudOS specific settings
platform=linux
arch=amd64
