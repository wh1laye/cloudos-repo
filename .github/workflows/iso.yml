name: iso

on:
  workflow_dispatch:
    inputs:
      version:
        description: версия live iso
        default: "2.2"
      base_tag:
        description: тег релиза с внутренней базой
        default: "1.5"
      base_version:
        description: версия внутренней базы
        default: "1.5"
      kernel:
        description: версия ядра
        default: "6.18.10"
      cloudk_version:
        description: версия ядра cloudk из релиза cloudk-<версия>
        default: "0.1"
      march:
        description: микроархитектура (v3 только для процессоров с avx2, 2013 и новее)
        type: choice
        options:
          - x86-64
          - x86-64-v3
        default: x86-64
      smoke:
        description: проверочная загрузка в qemu
        type: boolean
        default: true
      install_test:
        description: тестовая установка на диск в qemu и загрузка установленной системы
        type: boolean
        default: true
      publish:
        description: выложить iso в релиз
        type: boolean
        default: true

concurrency:
  group: iso-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: проверка ключа подписи
        if: ${{ inputs.publish }}
        env:
          HAS_KEY: ${{ secrets.MINISIGN_KEY != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::MINISIGN_KEY не задан, публикация без подписи запрещена"; exit 1; }

      - name: проверка параметров
        env:
          VERSION: ${{ inputs.version }}
          KVER: ${{ inputs.kernel }}
          CVER: ${{ inputs.cloudk_version }}
          PUBLISH: ${{ inputs.publish }}
          SMOKE: ${{ inputs.smoke }}
          ITEST: ${{ inputs.install_test }}
        run: |
          case "$VERSION" in ''|*[!0-9A-Za-z._-]*) echo "::error::неверная версия"; exit 1 ;; esac
          case "$KVER" in ""|*[!0-9.]*) echo "::error::неверная версия ядра"; exit 1 ;; esac
          case "$CVER" in ""|*[!0-9A-Za-z._]*) echo "::error::неверная версия cloudk"; exit 1 ;; esac
          if [ "$PUBLISH" = true ] && { [ "$SMOKE" != true ] || [ "$ITEST" != true ]; }; then echo "::error::публикация без smoke и install_test запрещена"; exit 1; fi
      - name: проверка скриптов
        run: |
          for f in tools/mkiso.sh tools/iso/mkiso-inside.sh tools/iso/init tools/iso/cloudos-install tools/iso/cloudos-secureboot tools/iso/cloudos-uki tools/iso/cloudos-tpm2 tools/iso/dracut-tpm2/*.sh tools/kernel/*.sh tools/stage3/cloudos-firewall tools/stage3/cloudos-audit; do bash -n "$f"; done

      - name: место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/iso && sudo chown "$USER" /mnt/iso
          df -h / /mnt

      - name: внутренняя база
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.base_tag }}
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          mkdir -p dl
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" -p "cloudos-stage3-amd64-$BASE_VERSION.tar.xz*" -D dl
          ls -lh dl
          ( cd dl && sha256sum -c "cloudos-stage3-amd64-$BASE_VERSION.tar.xz.sha256" )

      - name: сборка iso
        env:
          VERSION: ${{ inputs.version }}
          BASE_VERSION: ${{ inputs.base_version }}
          MARCH: ${{ inputs.march }}
          KVER: ${{ inputs.kernel }}
          CLOUDK_VER: ${{ inputs.cloudk_version }}
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          mkdir -p "$PWD/out"
          sudo -E env WORK=/mnt/iso OUT="$PWD/out" VERSION="$VERSION" KVER="$KVER" CLOUDK_VER="$CLOUDK_VER" BASE="$PWD/dl/cloudos-stage3-amd64-$BASE_VERSION.tar.xz" \
            bash tools/mkiso.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -lh out

      - name: проверочная загрузка в qemu
        id: smoke
        if: ${{ inputs.smoke }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso
          ISO="$PWD/out/cloudos-live-amd64-$VERSION.iso"
          mkdir -p smoke
          xorriso -osirrox on -indev "$ISO" -extract /boot/vmlinuz smoke/vmlinuz -extract /boot/initramfs.img smoke/initramfs.img 2>/dev/null
          ACCEL=""
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm"; fi
          timeout 420 qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -display none -serial stdio -no-reboot \
            -kernel smoke/vmlinuz -initrd smoke/initramfs.img -append "console=ttyS0 earlycon=uart8250,io,0x3f8,115200n8 cloudos.smoke" -cdrom "$ISO" > "$PWD/smoke.log" 2>&1 || true
          grep -aq 'cloudos-smoke: FAIL' smoke.log && { grep -a 'cloudos-smoke:' smoke.log; echo "живая проверка не прошла"; exit 1; }
          grep -aq 'cloudos-smoke: ok' smoke.log || { echo "--- конец лога загрузки ---"; tail -n 80 smoke.log | tr -d '\033'; echo "--- ключевые строки ---"; grep -aiE 'panic|oops|bug:|unable to|cannot|failed|не смонт|rescue|cloudos-init|module|signature' smoke.log | tr -d '\033' | head -n 40; echo "нет cloudos-smoke: ok, система не дошла до проверки"; exit 1; }
          grep -aq 'cloudos-init: switch_root' smoke.log || { echo "initramfs не дошёл до switch_root"; exit 1; }
          grep -aq 'is starting up' smoke.log || { echo "openrc не стартовал"; exit 1; }
          grep -aqE 'nftables|нет службы nftables' smoke.log || { echo "в логе загрузки нет nftables"; exit 1; }
          if grep -aqE 'правила в .* не проходят проверку' smoke.log; then echo "nftables не принял правила"; exit 1; fi

      - name: тестовая установка и загрузка установленной системы
        id: itest
        if: ${{ inputs.install_test }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso
          ISO="$PWD/out/cloudos-live-amd64-$VERSION.iso"
          mkdir -p itest
          xorriso -osirrox on -indev "$ISO" -extract /boot/vmlinuz itest/vmlinuz -extract /boot/initramfs.img itest/initramfs.img 2>/dev/null
          qemu-img create -f raw itest/disk.img 6G
          ACCEL=""
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm"; fi
          timeout 1500 qemu-system-x86_64 $ACCEL -m 3072 -smp 2 -display none -serial stdio -no-reboot \
            -kernel itest/vmlinuz -initrd itest/initramfs.img -append "console=ttyS0 cloudos.smoke cloudos.itest" -cdrom "$ISO" \
            -drive file=itest/disk.img,format=raw,if=virtio > "$PWD/itest-install.log" 2>&1 || true
          grep -a 'cloudos-smoke:' itest-install.log | tail -n 5
          grep -aq 'cloudos-smoke: itest ok' itest-install.log || { tail -n 80 itest-install.log | tr -d '\033'; echo "установка на диск не прошла"; exit 1; }
          timeout 600 qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -display none -serial stdio -no-reboot \
            -drive file=itest/disk.img,format=raw,if=virtio -boot c > "$PWD/itest-boot.log" 2>&1 || true
          grep -aq 'Kernel panic' itest-boot.log && { echo "паника ядра при загрузке установленной системы"; exit 1; }
          grep -aq 'is starting up' itest-boot.log || { echo "установленная система не дошла до openrc"; exit 1; }
          echo "установленная система загрузилась до openrc"

      - name: итог в summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### iso $VERSION"
            ls -lh out 2>/dev/null | sed 's/^/    /' || true
            if [ -s "$RUNNER_TEMP/build.log" ] && grep -qE '::error::|ошибка:|rror:|упал' "$RUNNER_TEMP/build.log"; then
              echo "### где упало"
              grep -nE '::error::|ошибка:|fatal error|error:|Error [0-9]+|No such file|undefined reference|!!' "$RUNNER_TEMP/build.log" | tail -n 25 | sed 's/^/    /'
              echo "---"
              tail -n 60 "$RUNNER_TEMP/build.log" | sed 's/^/    /'
            fi
            echo "### тестовая установка: ${{ steps.itest.outcome }}"
            if [ -s itest-boot.log ]; then tail -n 30 itest-boot.log | tr -d '\033' | sed 's/^/    /'; fi
            echo "### проверочная загрузка: ${{ steps.smoke.outcome }}"
            if [ -s smoke.log ]; then tail -n 40 smoke.log | tr -d '\033' | sed 's/^/    /'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: логи
        if: always()
        run: |
          cp "$RUNNER_TEMP/build.log" "$PWD/build.log" 2>/dev/null || true

      - name: подпись происхождения (attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.iso

      - name: подпись minisign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then echo "::warning::секрет MINISIGN_KEY не задан, релиз выйдет без подписи minisign"; exit 0; fi
          sudo apt-get install -y -qq minisign
          bash tools/sign.sh out/*.iso out/*.iso.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolog-${{ inputs.version }}
          path: |
            build.log
            smoke.log
            itest-install.log
            itest-boot.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: cloudos-iso-${{ inputs.version }}
          path: out/*
          compression-level: 0

      - name: релиз
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          SIZE=$(stat -c %s "out/cloudos-live-amd64-$VERSION.iso")
          [ "$SIZE" -lt 2147483648 ] || { echo "iso $SIZE байт, лимит github releases 2 гб"; exit 1; }
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "CloudOS $VERSION" \
            --notes "cloudos live iso $VERSION. установка: загрузись с iso и выполни doas cloudos-install. проверка: sha256sum -c cloudos-live-amd64-$VERSION.iso.sha256"
          FILES=("out/cloudos-live-amd64-$VERSION.iso" "out/cloudos-live-amd64-$VERSION.iso.sha256")
          for s in out/*.minisig; do [ -e "$s" ] && FILES+=("$s"); done
          gh release upload "$VERSION" "${FILES[@]}" --clobber
