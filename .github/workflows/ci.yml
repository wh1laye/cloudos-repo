name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S error

      - name: сборка cloudpkg
        run: make -C cloudpkg CC="gcc -Werror"

      - name: зависимости тестов
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: тесты
        run: |
          for t in cloudpkg snapshots forum update-sign hardening; do
            bash "tools/test-$t.sh"
          done
