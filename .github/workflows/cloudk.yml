name: cloudk

on:
  workflow_dispatch:
    inputs:
      kver:
        description: kernel version
        required: false
        default: "6.18.10"
        type: string
      ver:
        description: cloudk release version
        required: false
        default: "0.6"
        type: string
  push:
    branches: [main]
    paths:
      - "tools/kernel/**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        march: [x86-64, x86-64-v3]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev \
            zstd patch git curl tar xz-utils gpg minisign
      - name: signing key
        run: |
          if [ -n "$CLOUDK_SIGNING_KEY" ]; then
            printf '%s' "$CLOUDK_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/cloudk.minisign.key"
            chmod 600 "$RUNNER_TEMP/cloudk.minisign.key"
            echo "SIGN_KEY=$RUNNER_TEMP/cloudk.minisign.key" >> "$GITHUB_ENV"
          fi
        env:
          CLOUDK_SIGNING_KEY: ${{ secrets.CLOUDK_SIGNING_KEY }}
      - name: build cloudk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          JOBS=$(nproc) MARCH=${{ matrix.march }} \
          CLOUDK_VER=${{ inputs.ver || '0.6' }} KVER=${{ inputs.kver || '6.18.10' }} \
          OUT="$GITHUB_WORKSPACE/out" CACHY_REQUIRED=0 \
          MINISIGN_KEY="${SIGN_KEY:-}" bash tools/kernel/build-cloudk.sh
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudk-${{ inputs.ver || '0.6' }}-${{ matrix.march }}
          path: out/
      - name: release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cloudk-${{ inputs.ver || '0.6' }}
          files: out/*
