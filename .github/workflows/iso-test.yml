name: iso-test

on:
  schedule:
    - cron: "23 4 * * 1"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: тег релиза с iso (пусто, чтобы взять последний релиз с iso)
        default: ""

concurrency:
  group: iso-test-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, btrfs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: найти и скачать iso
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          if [ -z "$TAG" ]; then
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '.[].tagName'); do
              if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^cloudos-live-amd64-.*\.iso$' >/dev/null; then
                TAG=$t
                break
              fi
            done
          fi
          if [ -z "$TAG" ]; then
            echo "::warning::нет релиза с iso"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p dl
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'cloudos-live-amd64-*.iso*' -D dl; then
            echo "::warning::в релизе $TAG нет iso"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISO=$(find dl -maxdepth 1 -name 'cloudos-live-amd64-*.iso' | head -n 1)
          [ -n "$ISO" ] || { echo "::warning::в релизе $TAG нет iso"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -f "$ISO.sha256" ] || { echo "нет $ISO.sha256"; exit 1; }
          (cd dl && sha256sum -c "$(basename "$ISO").sha256")
          if [ -f "$ISO.minisig" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
            minisign -Vm "$ISO" -x "$ISO.minisig" -p docs/cloudos.pub
          else
            echo "::warning::у $TAG нет подписи minisign"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"

      - name: проверочная загрузка
        if: ${{ steps.dl.outputs.skip != '1' && matrix.fs == 'ext4' }}
        env:
          ISO: ${{ steps.dl.outputs.iso }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 xorriso
          mkdir -p smoke
          xorriso -osirrox on -indev "$ISO" -extract /boot/vmlinuz smoke/vmlinuz -extract /boot/initramfs.img smoke/initramfs.img 2>/dev/null
          ACCEL=""
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm"; fi
          timeout 420 qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -display none -serial stdio -no-reboot \
            -kernel smoke/vmlinuz -initrd smoke/initramfs.img -append "console=ttyS0 cloudos.smoke" -cdrom "$ISO" > "$PWD/smoke.log" 2>&1 || true
          if grep -aq 'cloudos-smoke: FAIL' smoke.log; then grep -a 'cloudos-smoke:' smoke.log; echo "живая проверка не прошла"; exit 1; fi
          grep -aq 'cloudos-smoke: ok' smoke.log || { echo "нет cloudos-smoke: ok"; exit 1; }
          grep -aq 'cloudos-init: switch_root' smoke.log || { echo "initramfs не дошёл до switch_root"; exit 1; }
          grep -aq 'is starting up' smoke.log || { echo "openrc не стартовал"; exit 1; }

      - name: тестовая установка (${{ matrix.fs }}) и загрузка установленной системы
        if: ${{ steps.dl.outputs.skip != '1' }}
        env:
          ISO: ${{ steps.dl.outputs.iso }}
          FS: ${{ matrix.fs }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso
          mkdir -p itest
          xorriso -osirrox on -indev "$ISO" -extract /boot/vmlinuz itest/vmlinuz -extract /boot/initramfs.img itest/initramfs.img 2>/dev/null
          qemu-img create -f raw itest/disk.img 6G
          ACCEL=""
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm"; fi
          timeout 1500 qemu-system-x86_64 $ACCEL -m 3072 -smp 2 -display none -serial stdio -no-reboot \
            -kernel itest/vmlinuz -initrd itest/initramfs.img -append "console=ttyS0 cloudos.smoke cloudos.itest cloudos.itest.fs=$FS" -cdrom "$ISO" \
            -drive file=itest/disk.img,format=raw,if=virtio > "$PWD/itest-$FS-install.log" 2>&1 || true
          grep -a 'cloudos-smoke:' "itest-$FS-install.log" | tail -n 5
          grep -aq 'cloudos-smoke: itest ok' "itest-$FS-install.log" || { echo "установка на диск ($FS) не прошла"; exit 1; }
          timeout 600 qemu-system-x86_64 $ACCEL -m 2048 -smp 2 -display none -serial stdio -no-reboot \
            -drive file=itest/disk.img,format=raw,if=virtio -boot c > "$PWD/itest-$FS-boot.log" 2>&1 || true
          if grep -aq 'Kernel panic' "itest-$FS-boot.log"; then echo "паника ядра при загрузке ($FS)"; exit 1; fi
          grep -aq 'is starting up' "itest-$FS-boot.log" || { echo "установленная система ($FS) не дошла до openrc"; exit 1; }
          echo "установленная система ($FS) загрузилась до openrc"

      - name: итог в summary
        if: always()
        env:
          FS: ${{ matrix.fs }}
          TAG: ${{ steps.dl.outputs.tag }}
        run: |
          {
            echo "### iso-test $FS, релиз ${TAG:-нет}"
            if [ -s "itest-$FS-boot.log" ]; then tail -n 30 "itest-$FS-boot.log" | tr -d '\033' | sed 's/^/    /'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-test-${{ matrix.fs }}
          path: |
            smoke.log
            itest-*.log
          if-no-files-found: ignore
