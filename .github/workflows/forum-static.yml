name: forum static pages

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forum-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: generate
        run: node .github/scripts/forum-static.mjs
        env:
          SITE_URL: https://cloudos-repo.pages.dev
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/forum/t docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "forum: update static pages"
            git push
          fi
