name: stage3

on:
  workflow_dispatch:
    inputs:
      version:
        description: версия
        default: "1.4"
      refresh_list:
        description: взять список пакетов из настоящего stage 3 gentoo
        type: boolean
        default: true
      strict:
        description: остановить сборку, если хоть один пакет не собрался
        type: boolean
        default: true
      publish:
        description: выложить результат в релиз
        type: boolean
        default: true

concurrency:
  group: stage3-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: проверка параметров
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in ''|*[!0-9A-Za-z._-]*) echo "::error::неверная версия"; exit 1 ;; esac

      - name: проверка скриптов и cloudpkg
        run: |
          for f in tools/build-stage3.sh tools/test-cloudpkg.sh tools/stage3/*.sh tools/stage3/cloudos-adduser tools/stage3/neofetch tools/stage3/cloudos-firewall tools/stage3/cloudos-audit tools/test-firewall.sh tools/test-forum.sh cloudpkg/*.sh; do bash -n "$f"; done
          make -C cloudpkg clean all CC="gcc -Wextra -Werror"
          ./cloudpkg/cloudpkg version
          sudo bash tools/test-cloudpkg.sh

      - name: проверка фаервола
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          sudo bash tools/test-firewall.sh

      - name: проверка форума
        run: bash tools/test-forum.sh

      - name: место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/stage3 && sudo chown "$USER" /mnt/stage3
          df -h / /mnt

      - name: сборка stage 3
        env:
          VERSION: ${{ inputs.version }}
          REFRESH_LIST: ${{ inputs.refresh_list && '1' || '0' }}
          STRICT: ${{ inputs.strict && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p "$PWD/out"
          sudo -E env WORK=/mnt/stage3 OUT="$PWD/out" VERSION="$VERSION" REFRESH_LIST="$REFRESH_LIST" STRICT="$STRICT" \
            bash tools/build-stage3.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -lh out

      - name: карта размеров
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/stage3-map.py "out/cloudos-stage3-amd64-$VERSION.tar.xz" -o "out/cloudos-stage3-amd64-$VERSION.map.json"

      - name: итог в summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            if [ -s "$RUNNER_TEMP/build.log" ] && grep -qE '::error::|ошибка:|rror:|упал' "$RUNNER_TEMP/build.log"; then
              echo "### где упало (хвост лога и строки с ошибкой)"
              grep -nE '::error::|ошибка:|fatal error|error:|Error [0-9]+|No such file|undefined reference|CMake Error' "$RUNNER_TEMP/build.log" | tail -n 25 | sed 's/^/    /'
              echo "---"
              tail -n 60 "$RUNNER_TEMP/build.log" | sed 's/^/    /'
            fi
            echo "### stage3 $VERSION"
            ls -lh out 2>/dev/null | sed 's/^/    /' || true
            for f in out/*.failed.txt; do
              [ -f "$f" ] || continue
              echo "### не собрались пакеты"
              sed 's/^/    /' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: подпись происхождения (attestation)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: cloudos-stage3-${{ inputs.version }}
          path: out/*
          compression-level: 0

      - name: логи сборки
        if: always()
        run: |
          cp "$RUNNER_TEMP/build.log" "$PWD/build.log" 2>/dev/null || true
          sudo tar -C /mnt/stage3/root/var/tmp -czf "$PWD/s3log.tgz" s3log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3log-${{ inputs.version }}
          path: |
            s3log.tgz
            build.log
          if-no-files-found: ignore

      - name: релиз
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "CloudOS $VERSION" \
            --notes "stage 3 cloudos $VERSION. проверка: sha256sum -c cloudos-stage3-amd64-$VERSION.tar.xz.sha256"
          gh release upload "$VERSION" out/* --clobber
