COMMON_FLAGS="-O2 -march=x86-64 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
CC="gcc -std=gnu17"
MAKEOPTS="-j4"
USE="-systemd -X -wayland -gtk -qt5 -qt6 -pulseaudio -doc -man -nls -test"
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"
PYTHON_TARGETS="python3_13"
PYTHON_SINGLE_TARGET="python3_13"
GRUB_PLATFORMS="efi-64 pc"
FEATURES="-sandbox -usersandbox -network-sandbox -ipc-sandbox -pid-sandbox -userpriv -userfetch -usersync -news"
PORTAGE_TMPDIR="/var/tmp"
DISTDIR="/var/cache/distfiles"
GENTOO_MIRRORS="https://mirrors.ustc.edu.cn/gentoo https://mirrors.aliyun.com/gentoo https://mirror.yandex.ru/gentoo-distfiles https://distfiles.gentoo.org"
FETCHCOMMAND="curl -fL --retry 3 --connect-timeout 20 -o \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
RESUMECOMMAND="curl -fL -C - --retry 3 --connect-timeout 20 -o \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
