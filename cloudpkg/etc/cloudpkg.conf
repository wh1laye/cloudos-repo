# зеркала gentoo по порядку, от первого к последнему
mirror=https://mirrors.ustc.edu.cn/gentoo
mirror=https://mirrors.aliyun.com/gentoo
mirror=https://mirror.yandex.ru/gentoo-distfiles
mirror=https://distfiles.gentoo.org
snapshot=snapshots/portage-latest.tar.xz
# запасной канал, если ни одно зеркало не ответило (полная ссылка на архив дерева)
fallback=https://codeload.github.com/gentoo-mirror/gentoo/tar.gz/refs/heads/master
repo=/var/db/repos/gentoo
distdir=/var/cache/distfiles
# профиль portage, ссылка /etc/portage/make.profile ставится сама после sync
profile=default/linux/amd64/23.0
