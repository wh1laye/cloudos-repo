<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t="страница не найдена: cloudos">страница не найдена: cloudos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://wh1laye.github.io/cloudos-repo/icon.svg" type="image/svg+xml">
<link rel="icon" href="https://wh1laye.github.io/cloudos-repo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="https://wh1laye.github.io/cloudos-repo/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html{--bg:#1a1c20;--surf:#22252a;--line:#33373e;--ink:#e6e8ec;--mute:#98a2ae;--ac:#8fb4f0;--onac:#11151b}html[data-theme=light]{--bg:#f6f8fc;--surf:#fff;--line:#e2e8f2;--ink:#17202e;--mute:#66758a;--ac:#3563c9;--onac:#fff}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.box{width:min(520px,100%);text-align:center}.code{font:600 88px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--ac);letter-spacing:-.04em;margin:0 0 6px}h1{font-size:26px;margin:0 0 8px;font-weight:600}p{color:var(--mute);margin:0 0 24px}.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}a{display:inline-block;padding:9px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);text-decoration:none;font-weight:500;transition:border-color .12s}a:hover{border-color:var(--ac)}a.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}</style>
<script>(function(){var t='gray',v,o={light:1,night:1,nord:1,dracula:1,sepia:1};try{v=localStorage.getItem('theme');if(o[v]||((v==='matrix'||v==='amber')&&localStorage.getItem('sec')==='1'))t=v}catch(e){}document.documentElement.setAttribute('data-theme',t)})()</script>
<script src="i18n.js?v=6" defer></script>
<script src="typo.js?v=1" defer></script>
</head>
<body>
<div class="box">
<p class="code">404</p>
<h1 data-t="Страница не найдена">Страница не найдена</h1>
<p data-t="Такой страницы нет или она переехала. Вернись на главную или открой нужный раздел.">Такой страницы нет или она переехала. Вернись на главную или открой нужный раздел.</p>
<div class="row" id="lk"></div>
</div>
<script>
(function(){
  var p=location.pathname.split('/').filter(Boolean);
  var b=location.hostname.slice(-9)==='github.io'&&p.length?'/'+p[0]+'/':'/';
  var L=[['',  'главная',   'home',         'p'],
         ['handbook/','справочник','handbook',''],
         ['news/',    'новое',     'news',    ''],
         ['forum/',   'форум',     'forum',   ''],
         ['releases/','релизы',    'releases','']];
  function lang(){return window.CloudTheme&&window.CloudTheme.getLang?window.CloudTheme.getLang():'ru'}
  function tr(s){return window.I18N&&window.I18N.t?window.I18N.t(s):s}
  document.getElementById('lk').innerHTML=L.map(function(x){
    var label=lang()==='en'?x[2]:x[1];
    return '<a class="'+x[3]+'" href="'+b+x[0]+'">'+label+'</a>';
  }).join('');
  function translateAll(){
    var l=lang();
    document.documentElement.lang=l;
    [].forEach.call(document.querySelectorAll('[data-t]'),function(el){
      el.textContent=tr(el.getAttribute('data-t'));
    });
    document.title=tr('Страница не найдена: cloudos');
    document.getElementById('lk').innerHTML=L.map(function(x){
      var label=l==='en'?x[2]:tr(x[1]);
      return '<a class="'+x[3]+'" href="'+b+x[0]+'">'+label+'</a>';
    }).join('');
  }
  window.addEventListener('cloudlang',translateAll);
  if(window.I18N)translateAll();
})();
</script>
</body>
</html>
